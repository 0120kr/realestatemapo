name: Android APK

on:
  push:
    branches: [claude/mobile-app-analysis-xaigd2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          sh scripts/build-www.sh
          npx cap add android

      - name: Add location permission, icons and splash
        run: |
          RES=android/app/src/main/res
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            rm -f "$RES/mipmap-$d/ic_launcher_foreground.png"
            cp android-icons/mipmap-$d/*.png "$RES/mipmap-$d/"
          done
          find "$RES" -name splash.png -exec cp android-icons/splash/splash.png {} \;
          npx cap sync android

      - name: Build APK
        run: |
          # 매번 같은 키로 서명해야 새 버전을 지우지 않고 덮어 설치할 수 있다
          mkdir -p ~/.android
          cp android-keystore/debug.keystore ~/.android/debug.keystore
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk oneulmeonji.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest oneulmeonji.apk \
            --target "${{ github.sha }}" \
            --title "오늘먼지 안드로이드 앱" \
            --notes "휴대폰에서 oneulmeonji.apk를 눌러 내려받은 뒤 설치하세요. (빌드: ${{ github.sha }})"
